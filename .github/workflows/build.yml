name: Build static ffmpeg

on:
  push:
  pull_request:
  workflow_dispatch:


jobs:
  package-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch:
          - x86_64
          #- arm64
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update -y && \
          sudo apt-get install -y yasm lame libmp3lame-dev libopus-dev libvorbis-dev libogg-dev libc6-dev binutils
      - name: Remove vorbis, ogg, opus and lame .so files # or it just dynamically links!
        run: |
          sudo find /usr/lib/x86_64-linux-gnu -type f -name "*lame*.so*" -exec rm -f {} +
          sudo find /usr/lib/x86_64-linux-gnu -type f -name "*opus*.so*" -exec rm -f {} +
          sudo find /usr/lib/x86_64-linux-gnu -type f -name "*vorbis*.so*" -exec rm -f {} +
          sudo find /usr/lib/x86_64-linux-gnu -type f -name "*libogg*.so*" -exec rm -f {} +
      - name: Install ARM64 compiler
        if: env.ARCH == 'arm64'
        run: |
          sudo apt-get update -y && \
          sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build
        run: ./build-linux.sh

  #     - name: Archive production artifacts
  #       uses: actions/upload-artifact@v4
  #       with:
  #         name: ffmpeg-linux-${{ env.ARCH }}
  #         path: artifacts/

  package-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        arch:
          - x86_64
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4

      - name: Install MSYS2
        uses: msys2/setup-msys2@v2
        with:
          update: true
          cache: true
          msystem: UCRT64
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            diffutils
            make
            mingw-w64-ucrt-x86_64-pkg-config
            mingw-w64-ucrt-x86_64-lame
            mingw-w64-ucrt-x86_64-libvorbis
            mingw-w64-ucrt-x86_64-libogg
            mingw-w64-ucrt-x86_64-opus
            mingw-w64-ucrt-x86_64-nasm
            binutils
            mingw-w64-ucrt-x86_64-binutils

      - name: Verify lib locations
        run: |
          pacman -Ql mingw-w64-ucrt-x86_64-lame \
            mingw-w64-ucrt-x86_64-libvorbis \
            mingw-w64-ucrt-x86_64-libogg \
            mingw-w64-ucrt-x86_64-opus \
            mingw-w64-ucrt-x86_64-nasm

          echo ${PATH}
        shell: msys2 {0}

      - name: Build
        run: |
          export PATH="/ucrt64/x86_64-w64-mingw32/bin:$PATH"
          ./build-windows.sh
        shell: msys2 {0}
      - name: Archive production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-windows-${{ env.ARCH }}
          path: artifacts/

  package-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        # https://developer.apple.com/documentation/apple-silicon/building-a-universal-macos-binary#Update-the-Architecture-List-of-Custom-Makefiles
        target:
          # - x86_64-apple-macos10.9
          - arm64-apple-macos15
    env:
      TARGET: ${{ matrix.target }}
      MACOSX_DEPLOYMENT_TARGET: "15.0"
      ARCH: arm64
      LAME_REF: master # Replace with a reviewed, fixed commit SHA.
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install yasm opus libvorbis libogg
      
      # - name: Install libmp3lame
      #   run: |
      #     # Ensure Homebrew packages are ARM64 compatible
      #     export MACOSX_DEPLOYMENT_TARGET=14.0
      #     brew install lame --build-from-source
      #     otool -l "$(brew --prefix lame)/bin/lame" | grep -A 5 LC_BUILD_VERSION
      #     # curl -fsSL -o lame.tar.gz "https://downloads.sourceforge.net/project/lame/4.0/lame-4.0.tar.gz" 
      #     # tar xzf lame.tar.gz 
      #     # cd lame-4.0
      #     # ./configure --prefix=/opt/homebrew/opt/lame --enable-static --disable-shared 
      #     # make -j$(sysctl -n hw.ncpu) 
      #     # sudo make install
      - name: Remove vorbis, ogg, opus  .dylib files # or it just dynamically links!
        run: |
          find /opt/homebrew -type f -name "*opus*.dylib" -exec rm -f {} +
          find /opt/homebrew -type f -name "*vorbis*.dylib" -exec rm -f {} +
          find /opt/homebrew -type f -name "*libogg*.dylib" -exec rm -f {} +
      - name: Install build tools
        run: brew install autoconf automake libtool
      
      - name: Build static mpg123
        shell: bash
        run: |
          set -euo pipefail

          MPG123_PREFIX="$RUNNER_TEMP/mpg123-install"
          MPG123_SRC="$RUNNER_TEMP/mpg123-src"

          git clone https://github.com/libsdl-org/mpg123.git "$MPG123_SRC"
          # For reproducible builds, check out a reviewed release tag or commit here.
          cd "$MPG123_SRC"

          export MACOSX_DEPLOYMENT_TARGET=15.0
          export CC=/usr/bin/clang
          export CFLAGS="-O2 -target $TARGET -mmacosx-version-min=$MACOSX_DEPLOYMENT_TARGET"
          export LDFLAGS="-target $TARGET -mmacosx-version-min=$MACOSX_DEPLOYMENT_TARGET"

          ./configure \
            --prefix="$MPG123_PREFIX" \
            --disable-shared \
            --enable-static \
            --disable-components \
            --enable-libmpg123

          make -j"$(sysctl -n hw.ncpu)"
          make install

          test -f "$MPG123_PREFIX/lib/libmpg123.a"
          lipo -info "$MPG123_PREFIX/lib/libmpg123.a"

          echo "MPG123_PREFIX=$MPG123_PREFIX" >> "$GITHUB_ENV"
      - name: Build static LAME 4.0 for the target
        shell: bash

        run: |
          set -euo pipefail
          export PKG_CONFIG_PATH="$MPG123_PREFIX/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
          LAME_PREFIX="$RUNNER_TEMP/lame-install"
          LAME_SRC="$RUNNER_TEMP/lame-src"
          LAME_ARCHIVE="$RUNNER_TEMP/lame-4.0.tar.gz"
          MACOSX_DEPLOYMENT_TARGET=

          curl --fail --location --retry 3 \
            "https://downloads.sourceforge.net/project/lame/lame/4.0/lame-4.0.tar.gz" \
            --output "$LAME_ARCHIVE"

          mkdir -p "$LAME_SRC"
          tar -xzf "$LAME_ARCHIVE" -C "$LAME_SRC" --strip-components=1
          cd "$LAME_SRC"

          export MACOSX_DEPLOYMENT_TARGET=15.0
          export CC=/usr/bin/clang
          export CFLAGS="-O2 -mmacosx-version-min=$MACOSX_DEPLOYMENT_TARGET"
          export LDFLAGS="-mmacosx-version-min=$MACOSX_DEPLOYMENT_TARGET"
          export PKG_CONFIG_PATH="$LAME_PREFIX/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
          echo "PKG_CONFIG_PATH=$PKG_CONFIG_PATH" >> "$GITHUB_ENV"
          ./configure \
            --prefix="$LAME_PREFIX" \
            --disable-shared \
            --enable-static \
            --disable-frontend

          make -j"$(sysctl -n hw.ncpu)"
          make install

          test -f "$LAME_PREFIX/lib/libmp3lame.a"
          lipo -info "$LAME_PREFIX/lib/libmp3lame.a"

          echo "LAME_PREFIX=$LAME_PREFIX" >> "$GITHUB_ENV"

      - name: Check LAME install
        shell: bash
        run: |
          set -euxo pipefail

          LAME_PREFIX="$RUNNER_TEMP/lame-install"
          ls -l "$LAME_PREFIX/include/lame"
          ls -l "$LAME_PREFIX/lib/libmp3lame.a"
          cat "$LAME_PREFIX/lib/pkgconfig/lame.pc"

          pkg-config --modversion lame
          pkg-config --cflags --libs lame

      - name: Build
        run: ./build-macos.sh
        
      - name: Archive artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-${{ matrix.target }}
          path: artifacts/

  release:
    runs-on: ubuntu-latest
    needs:
      - package-linux
      - package-windows
      - package-macos
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/
      - name: Make tarballs
        run: |
          mkdir artifacts/release/
          cd artifacts/
          for dir in ffmpeg-*/ffmpeg-*
          do
            name=$(basename $dir)
            tar czf release/$name.tar.gz -C $(dirname $dir) $name
          done
          ls -l release/
      - name: GH Release
        uses: softprops/action-gh-release@v2.0.9
            
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: artifacts/release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
